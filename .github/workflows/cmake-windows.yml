name: CMake-Windows

on:
  push:
    branches: 
      - master
  pull_request:
    branches:
      - '**'
  workflow_dispatch:

env:
  BUILD_TYPE: Release

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: ${{ matrix.build_name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: true
      matrix:
        build_name: [windows-2022, windows-2022-cuda]
        include:
        - build_name: windows-2022
          os: windows-2022
          extra_deps: ""
          extra_cmake_def: '-DWITH_TORCH=OFF -DWITH_ZED=OFF'
        - build_name: windows-2022-cuda
          os: windows-2022
          extra_deps: ""
          extra_cmake_def: '-DWITH_TORCH=ON -DWITH_ZED=ON -DWITH_CUDASIFT=ON'

    steps:
    - uses: actions/checkout@v4

    - name: Restore test data
      id: cache-testdata
      if: matrix.build_name != 'windows-2022-cuda'
      uses: actions/cache@v4
      with:
        # SQLite DBs are binary-portable -> share the cache across
        # linux / macos / windows. Key omits runner.os on purpose so all
        # three OSes hit the same entry.
        path: data/tests/*.db
        key: testdata-${{ hashFiles('data/tests/manifest.txt') }}

    - name: Fetch test data
      if: matrix.build_name != 'windows-2022-cuda' && steps.cache-testdata.outputs.cache-hit != 'true'
      shell: bash
      run: bash scripts/fetch_test_data.sh

    - name: Install Windows Dependencies
      if: matrix.build_name == 'windows-2022'
      uses: ./.github/actions/install-windows-deps
 
    - name: Install Windows Dependencies with CUDA
      if: matrix.build_name == 'windows-2022-cuda'
      uses: ./.github/actions/install-windows-cuda-deps

    - name: Configure CMake
      run: |
        # K4A, K4W2 and ZED are located via these env vars (FindK4A.cmake / FindKinectSDK2.cmake
        # and the install rules), pointing at the export where the bundle staged their SDK files.
        $env:K4A_ROOT_DIR = "${{env.VCPKG_EXPORT_PATH}}/installed/x64-windows-release"
        $env:KINECTSDK20_DIR = "${{env.VCPKG_EXPORT_PATH}}/installed/x64-windows-release"
        $env:ZED_SDK_ROOT_DIR = "${{env.VCPKG_EXPORT_PATH}}/installed/x64-windows-release"
        cmake `
          -B ${{github.workspace}}/build `
          -DCMAKE_BUILD_TYPE=${{env.BUILD_TYPE}} `
          -DBUILD_AS_BUNDLE=ON `
          -DWITH_PYTHON=ON `
          -DWITH_CERES=ON `
          -DWITH_ORBBEC_SDK=ON `
          -DWITH_FREENECT2=ON `
          -DWITH_K4W2=ON `
          -DWITH_K4A=ON `
          -DWITH_DEPTHAI=ON `
          -DWITH_REALSENSE2=ON `
          -DWITH_CCCORELIB=ON `
          ${{ matrix.extra_cmake_def }} `
          -DBUILD_TESTING=ON `
          -DVCPKG_MANIFEST_INSTALL=OFF `
          -DVCPKG_TARGET_TRIPLET=x64-windows-release `
          -DVCPKG_INSTALLED_DIR="${{env.VCPKG_EXPORT_PATH}}/installed" `
          -DCMAKE_TOOLCHAIN_FILE=${{env.VCPKG_EXPORT_PATH}}/scripts/buildsystems/vcpkg.cmake `
          -DTorch_DIR=${{env.VCPKG_EXPORT_PATH}}/installed/x64-windows-release/tools/python3/Lib/site-packages/torch/share/cmake/Torch

    - name: Build
      run: cmake --build ${{github.workspace}}/build --config ${{env.BUILD_TYPE}} --target ALL_BUILD

    - name: Diagnose loader dependencies
      # ctest reports a loader failure as nothing but "Exit code 0xc0000135"
      # (STATUS_DLL_NOT_FOUND): the process dies before main(), so gtest prints
      # no output and the log never names the DLL that was not found. This walks
      # the import tree of the executables ctest is about to run and reports the
      # ones that do not resolve against the search path those processes see.
      #
      # Runs before Test, and keeps going on failure, so the report is in the log
      # whether or not ctest then fails. Diagnostic only: it asserts nothing.
      if: matrix.build_name != 'windows-2022-cuda'
      continue-on-error: true
      shell: pwsh
      working-directory: ${{github.workspace}}/build/bin
      run: |
        $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
        if (-not (Test-Path $vswhere)) { Write-Host "vswhere not found, skipping"; exit 0 }
        $vsPath = & $vswhere -latest -property installationPath
        # Sorted descending so this is the newest toolset, the one that built
        # the binaries, rather than whichever side-by-side version sorts first.
        $dumpbin = Get-ChildItem "$vsPath\VC\Tools\MSVC" -Filter 'dumpbin.exe' -Recurse -ErrorAction SilentlyContinue |
                   Where-Object { $_.FullName -like '*\Hostx64\x64\*' } |
                   Sort-Object FullName -Descending | Select-Object -First 1
        if (-not $dumpbin) { Write-Host "dumpbin not found under $vsPath, skipping"; exit 0 }
        Write-Host "dumpbin : $($dumpbin.FullName)"
        Write-Host "bin dir : $((Get-Location).Path) ($((Get-ChildItem -Filter '*.dll').Count) DLLs)"

        # The loader looks in the executable's own directory first, then
        # System32, then PATH. api-ms-win-* / ext-ms-* are virtual API sets
        # resolved by the loader with no file on disk, so they never count as
        # missing.
        $searchDirs = @((Get-Location).Path, "$env:SystemRoot\System32") +
                      ($env:PATH -split ';' | Where-Object { $_ -and (Test-Path $_) })

        # Load-time and delay-load imports have to be told apart: only a
        # missing load-time import kills the process with 0xc0000135. A missing
        # delay-load one is resolved on first call, or never, so it is normal
        # for the Windows security stack (HvsiFileTrust, wpaxholder) to show up
        # there on a runner. dumpbin prints them in two sections.
        function Get-Imports($file) {
          $load = @(); $delay = @(); $mode = $null
          foreach ($line in (& $dumpbin.FullName /dependents $file 2>$null)) {
            if     ($line -match 'following delay load dependencies') { $mode = 'delay'; continue }
            elseif ($line -match 'following dependencies')            { $mode = 'load';  continue }
            elseif ($line -match '^\s*Summary')                       { $mode = $null;  continue }
            if ($mode -and $line -match '^\s+(\S+\.dll)\s*$') {
              if ($mode -eq 'load') { $load += $Matches[1] } else { $delay += $Matches[1] }
            }
          }
          [pscustomobject]@{ Load = $load; Delay = $delay }
        }

        function Test-Resolvable($dll) {
          $key = $dll.ToLower()
          if ($key -like 'api-ms-*' -or $key -like 'ext-ms-*') { return $true }
          [bool]($searchDirs | ForEach-Object { Join-Path $_ $dll } |
                 Where-Object { Test-Path $_ } | Select-Object -First 1)
        }

        function Resolve-Dll($dll) {
          $searchDirs | ForEach-Object { Join-Path $_ $dll } |
            Where-Object { Test-Path $_ } | Select-Object -First 1
        }

        # Recurses through load-time imports only, which is the graph the
        # loader must satisfy before main() runs. Delay-load imports of each
        # visited binary are checked but not followed.
        function Walk($file, $seen, $missing, $missingDelay) {
          $imports = Get-Imports $file
          foreach ($dll in $imports.Delay) {
            if (-not (Test-Resolvable $dll)) { [void]$missingDelay.Add($dll) }
          }
          foreach ($dll in $imports.Load) {
            if (-not $seen.Add($dll.ToLower())) { continue }
            if ($dll.ToLower() -like 'api-ms-*' -or $dll.ToLower() -like 'ext-ms-*') { continue }
            $hit = Resolve-Dll $dll
            if ($hit) { Walk $hit $seen $missing $missingDelay } else { [void]$missing.Add($dll) }
          }
        }

        # test_ulogger passes today and rtabmap_core is what every failing test
        # has in common, so the three together separate "this executable is
        # broken" from "the dependency bundle is incomplete".
        foreach ($exe in @('test_ulogger.exe', 'test_corelib.exe', 'rtabmap-console.exe')) {
          if (-not (Test-Path $exe)) { Write-Host "--- $exe : not built"; continue }
          $seen         = [System.Collections.Generic.HashSet[string]]::new()
          $missing      = [System.Collections.Generic.HashSet[string]]::new()
          $missingDelay = [System.Collections.Generic.HashSet[string]]::new()
          Walk (Resolve-Path $exe).Path $seen $missing $missingDelay
          if ($missing.Count) {
            Write-Host "--- $exe : $($missing.Count) of $($seen.Count) LOAD-TIME imports MISSING (these fail the loader)"
            $missing | Sort-Object | ForEach-Object { Write-Host "        $_" }
          } else {
            Write-Host "--- $exe : all $($seen.Count) load-time imports resolve"
          }
          if ($missingDelay.Count) {
            Write-Host "      (delay-load, resolved on first call, not a loader failure: $(($missingDelay | Sort-Object) -join ', '))"
          }
        }
    - name: Test
      # Not run on the CUDA build, which is a build+package job only.
      #
      # The runner has no NVIDIA GPU or driver (see the driver-DLL note in
      # app/src/CMakeLists.txt), so no cv::cuda / CUDASIFT path can actually
      # execute there -- everything falls back to CPU and the run just repeats
      # the coverage the non-CUDA job already gives, on the same sources. It
      # used to cost more than it returned: the two cv::cuda-touching tests
      # (test_util3d_features, test_localgrid) had to be excluded because lazy
      # CUDA-init stalled them past the 300 s timeout, and once WITH_ZED=ON was
      # added to this job every remaining corelib test died in the loader with
      # 0xc0000135 (STATUS_DLL_NOT_FOUND) before reaching main(): rtabmap_core
      # links sl_zed64.dll, which imports the driver-only nvcuvid.dll /
      # nvEncodeAPI64.dll that a driver-less runner does not have.
      #
      # So this job compiles, links and packages the CUDA artifact; the
      # non-CUDA job is what verifies behaviour. Same reason the Info step
      # below is skipped here.
      if: matrix.build_name != 'windows-2022-cuda'
      working-directory: ${{github.workspace}}/build
      # PYTHONHOME points the embedded interpreter at vcpkg's bundled
      # Python install (where Lib/, DLLs/ live). Without it Python emits
      # "Could not find platform independent libraries <prefix>" at init
      # and runs without a stdlib, breaking every numpy import.
      # PYTHONNOUSERSITE=1: prevent the embedded Python interpreter from
      # loading numpy / other site-packages from %APPDATA%\Python that
      # were compiled against a different ABI than the build-time Python
      # (numpy 1.x/2.x mismatch crashes in test_pydetector /
      # test_pydescriptor / test_pymatcher).
      env:
        PYTHONHOME: ${{env.VCPKG_EXPORT_PATH}}/installed/x64-windows-release/tools/python3
        PYTHONNOUSERSITE: 1
      run: |
        ctest -C ${{env.BUILD_TYPE}} -V --timeout 300 -LE performance

    - name: Info
      # Skipped for CUDA: the binary links ZED (sl_zed64.dll -> nvcuvid/nvEncodeAPI64),
      # which need the NVIDIA driver; the GPU-less runner can't load the exe.
      if: matrix.build_name != 'windows-2022-cuda'
      working-directory: ${{github.workspace}}/build/bin
      run: |
        ./rtabmap-console --version

    - name: Build Windows Package
      shell: pwsh
      run: |
        if ("${{ github.event_name }}" -eq "pull_request") {
          cpack --config build/CPackConfig.cmake -G ZIP -B build
        } else {
          cmake --build ${{ github.workspace }}/build --config ${{ env.BUILD_TYPE }} --target package
        }

    - name: Rename CUDA artifacts
      if: matrix.build_name == 'windows-2022-cuda'
      shell: pwsh
      run: Get-ChildItem -Path "build" -Filter "RTABMap-*" | Rename-Item -NewName { $_.BaseName + "_cuda" + $_.Extension }

    - name: Upload RTABMap Artifacts (ZIP)
      uses: actions/upload-artifact@v4
      with:
        name: RTABMap-Binaries-${{ matrix.build_name }}-zip
        path: |
          build/RTABMap-*.zip
        compression-level: 0
        if-no-files-found: warn
        retention-days: ${{ github.event_name == 'pull_request' && 1 || 90 }}

    - name: Upload RTABMap Artifacts (Installer)
      if: github.event_name != 'pull_request'
      uses: actions/upload-artifact@v4
      with:
        name: RTABMap-Binaries-${{ matrix.build_name }}-exe
        path: |
          build/RTABMap-*.exe
        compression-level: 0
        if-no-files-found: warn
        retention-days: ${{ github.event_name == 'pull_request' && 1 || 90 }}

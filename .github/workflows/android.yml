name: android

# Android build environments (docker/noble/android/rtabmap_apiXX).
# amd64 only, so a single native runner and no manifest juggling.
# These build FROM introlab3it/rtabmap:android-noble-deps (docker/noble/android),
# which the docker_deps job below rebuilds and pushes from master only.

# No paths filters on the triggers: the `changes` job below filters pushes and
# pull requests, so the required check still reports (one that never does
# blocks the PR) and the path list lives in one place.
on:
  push:
    branches:
      - 'master'
  pull_request:
    branches:
      - '**'
  merge_group:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # Required checks must always report, so pushes and pull requests are
  # filtered here instead of on the trigger: jobs not affected by the
  # change are skipped, which counts as passing, and only android-ci below
  # is required by the ruleset. The merge queue and dispatches always build.
  changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      relevant: ${{ steps.filter.outputs.relevant == 'true' || (github.event_name != 'pull_request' && github.event_name != 'push') }}
    steps:
      # Pull requests are diffed through the API; a push needs the git history.
      - uses: actions/checkout@v4
        if: github.event_name == 'push'
      - uses: dorny/paths-filter@v3
        id: filter
        if: github.event_name == 'pull_request' || github.event_name == 'push'
        with:
          filters: |
            relevant:
              # What an Android build actually compiles: CMakeLists.txt adds only
              # utilite, corelib and app under IF(ANDROID), and rtabmap.bash builds with
              # WITH_OPENGV=OFF, BUILD_EXAMPLES=OFF, BUILD_TOOLS=OFF.
              - 'CMakeLists.txt'
              - 'Version.h.in'
              - 'RTABMapConfig.cmake.in'
              - 'cmake_uninstall.cmake.in'
              - 'cmake_modules/**'
              - 'utilite/**'
              - 'corelib/**'
              - 'app/android/**'
              - 'app/CMakeLists.txt'
              - 'docker/noble/android/**'
              - '.github/workflows/android.yml'

  docker_deps:
    # Skipped on pull requests and in the merge queue; built and pushed only
    # from master (push or manual dispatch), since it pushes the
    # :android-noble-deps tag to Docker Hub. When unchanged, the registry
    # cache makes this a quick no-op.
    needs: changes
    if: needs.changes.outputs.relevant == 'true' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest

    steps:
      -
        name: Checkout
        uses: actions/checkout@v4
      -
        name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      -
        name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      -
        name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64
          file: ./docker/noble/android/Dockerfile
          tags: introlab3it/rtabmap:android-noble-deps
          cache-from: type=registry,ref=introlab3it/rtabmap:android-noble-deps
          cache-to: type=inline

  docker:
    needs: [changes, docker_deps]
    # Run even when docker_deps is skipped (it is, on pull requests): the
    # Dockerfiles then pull the :android-noble-deps image already on Docker Hub.
    # A manual dispatch is honored only on master, the only ref we push from.
    if: ${{ !cancelled() && !failure() && needs.changes.outputs.relevant == 'true' && (github.event_name != 'workflow_dispatch' || github.ref == 'refs/heads/master') }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        docker_tag: [android23, android24, android26, android30]
        include:
        - docker_tag: android23
          docker_tags: |
            introlab3it/rtabmap:android23
            introlab3it/rtabmap:tango
          api_version: 23
        - docker_tag: android24
          docker_tags: |
            introlab3it/rtabmap:android24
          api_version: 24
        - docker_tag: android26
          docker_tags: |
            introlab3it/rtabmap:android26
          api_version: 26
        - docker_tag: android30
          docker_tags: |
            introlab3it/rtabmap:android30
          api_version: 30

    steps:
      -
        name: Checkout
        uses: actions/checkout@v4
      -
        name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      -
        name: Login to DockerHub
        # Only needed when pushing; skipped on pull requests (secrets are
        # unavailable for fork PRs and we don't push there anyway) and in the
        # merge queue (build only, the push happens once merged to master).
        if: github.event_name != 'pull_request' && github.event_name != 'merge_group'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      -
        name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' && github.event_name != 'merge_group' }}
          platforms: linux/amd64
          file: ./docker/noble/android/rtabmap_apiXX/Dockerfile
          build-args: |
            API_VERSION=${{ matrix.api_version }}
          tags: ${{ matrix.docker_tags }}
          cache-from: type=registry,ref=introlab3it/rtabmap:${{ matrix.docker_tag }}
          cache-to: type=inline

  # The only check of this workflow the ruleset requires: a matrix job skipped
  # by `if` does not report its per-entry names, so those cannot be required.
  android-ci:
    needs: [changes, docker_deps, docker]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Fail if any job failed or was cancelled
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
